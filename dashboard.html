      <template id="dashboardInfo">
        <p>This is a snapshot of the whole system, split into two halves: what exists in the system itself, and how well each supplier's own data lines up with it. Every count and label doubles as a shortcut straight into the screen behind it — there's no separate links section to hunt through.</p>
        <ul>
          <li><strong>System</strong> — total counts for Countries, Cities, and Hotels, plus how many of those cities were added or merged by hand rather than belonging to the original list, and how many countries have a Nationality set. These aren't mapped to anything themselves — they're what suppliers map into. Click a tile's title to open that list; Cities also has a direct link to add a new one.</li>
          <li><strong>Hotel Star Ratings</strong> — how the system's hotels break down across the 1–5 star scale, plus SC (no formal star rating).</li>
          <li><strong>Supplier</strong> — one card per supplier, with an overall mapped percentage next to its name, and a line each for Country/City/Hotel showing how many of their own records are linked to a system record versus their total count. Click Country/City/Hotel — or its View link — to open that supplier's list already scoped to this supplier. Browse suppliers a page at a time if there are more than fit at once.</li>
          <li><strong>Needs Attention</strong> — a quick highlight of the lowest mapping coverage across every supplier and entity, and which suppliers have the most inactive hotels, each with a link straight to that supplier's list.</li>
        </ul>
      </template>

      <template id="dashboardDevNotes">
        <p>Every number on this screen is computed fresh on page load, directly from the live in-memory data — nothing here is cached or precomputed, so it always reflects whatever is currently in storage. Navigation is attached directly to the stat it belongs to instead of living in a separate links block.</p>
        <ul>
          <li><strong>System tiles</strong> — plain lengths of the system Country/City/Hotel lists. <strong>Custom Cities</strong> counts every system city carrying a city-type marker (added via New City or created by a merge, as opposed to the original prepopulated list), split into how many of each kind. <strong>Nationality Set</strong> counts system countries whose Nationality field is non-null. Each tile's title links to that entity's System list; the Cities tile additionally links to Add City.</li>
          <li><strong>Hotel Star Ratings</strong> — every system hotel's `starRating` field, bucketed 5 down to 1 plus a 0 bucket labeled <strong>SC</strong> (a real classification for hotels with no formal star rating, e.g. serviced apartments — not "unrated data"), shown as a percentage of the total. Buckets with zero hotels still render, so the full scale's shape is visible. This is a plain magnitude distribution, not a coverage metric, so every bar shares one flat color instead of the tier scale used elsewhere on this page.</li>
          <li><strong>Supplier cards</strong> — one per supplier, with an overall percentage (mapped records summed across all three types, divided by their combined total) shown next to the name, colored by the same three-tier scale as the bars below it. Three lines follow: <strong>Country</strong> (mapped when a system country is assigned), <strong>City</strong> (mapped when a system city is assigned), <strong>Hotel</strong> (mapped when its provider identifier resolves to a real system hotel — hotels have no separate stored link, so this is a derived match, never a manually set one). Every label link carries this supplier along as a `?supplier=` deep link so the destination screen opens with that supplier already selected, not an empty "pick a supplier" state. Every line's View link points at that same Supplier List its label already does — City's used to go to the City Mapping screen instead, but that was inconsistent with the other two, so all three now agree: View always means "go look at this supplier's own list for this entity." The card list is paginated independently of every other list on this page.</li>
          <li><strong>Needs Attention</strong> — two independently computed, capped-at-3 highlight lists, not a general alert system. <strong>Lowest Mapping Coverage</strong> flattens all 12 supplier×entity combinations already computed for the Supplier cards above, sorts by percentage ascending, and shows the worst 3 — so which items appear changes automatically as coverage changes, never a fixed list of names. <strong>Inactive Hotels</strong> counts each supplier's own inactive hotel rows (the only entity with real active/inactive variance in this data — system records and other supplier entities are effectively always active in the seed data), shows suppliers with at least one inactive hotel, worst count first, capped at 3. Both link to that supplier's own list, deep-linked the same way as the Supplier cards.</li>
        </ul>
      </template>

<script>
  // Sub-lines read "<row count> rows · <supplier count> suppliers" — both
  // numbers bold so the line scans as two quick facts, short enough to
  // never wrap regardless of how large the row count gets.
  const supplierCount = Object.keys(SUPPLIER_LABELS).length;

  document.getElementById("statSystemCountries").textContent = SYSTEM_COUNTRIES.length;
  const supplierCountryTotal = Object.values(supplierCountries).flat().length;
  document.getElementById("statSupplierCountries").innerHTML =
    `<strong>${supplierCountryTotal}</strong> rows · <strong>${supplierCount}</strong> suppliers`;

  document.getElementById("statSystemCities").textContent = SYSTEM_CITIES.length;
  const supplierCityTotal = Object.values(supplierCities).flat().length;
  document.getElementById("statSupplierCities").innerHTML =
    `<strong>${supplierCityTotal}</strong> rows · <strong>${supplierCount}</strong> suppliers`;

  document.getElementById("statSystemHotels").textContent = SYSTEM_HOTELS.length;
  const supplierHotelTotal = Object.values(supplierHotels).flat().length;
  document.getElementById("statSupplierHotels").innerHTML =
    `<strong>${supplierHotelTotal.toLocaleString()}</strong> rows · <strong>${supplierCount}</strong> suppliers`;

  const customCities = SYSTEM_CITIES.filter((c) => c.cityType);
  const customCityCounts = {
    normal: customCities.filter((c) => c.cityType === "normal").length,
    merged: customCities.filter((c) => c.cityType === "merged").length,
  };
  document.getElementById("statCustomCities").textContent = customCities.length;
  document.getElementById("statCustomCitiesBreakdown").innerHTML =
    `<strong>${customCityCounts.normal}</strong> new · <strong>${customCityCounts.merged}</strong> merged`;

  const countriesWithNationality = SYSTEM_COUNTRIES.filter((c) => c.nationality).length;
  document.getElementById("statNationalitySet").textContent = `${countriesWithNationality}/${SYSTEM_COUNTRIES.length}`;
  const nationalityPct = SYSTEM_COUNTRIES.length ? Math.round((countriesWithNationality / SYSTEM_COUNTRIES.length) * 100) : 0;
  document.getElementById("statNationalitySub").innerHTML = `<strong>${nationalityPct}%</strong> have one set`;

  function coverageTierClass(pct) {
    if (pct >= 80) return "tier-good";
    if (pct >= 50) return "tier-warn";
    return "tier-low";
  }

  function meterRowHtml(label, mapped, total, href, viewHref, labelTitle, viewTitle) {
    const pct = total ? Math.round((mapped / total) * 100) : 0;
    const tier = coverageTierClass(pct);
    return `
      <div class="coverage-meter-row">
        <a class="coverage-meter-label" href="${href}" title="${labelTitle || ""}">${label}</a>
        <span class="coverage-meter-track ${tier}">
          <span class="coverage-meter-fill ${tier}" style="width:${pct}%"></span>
        </span>
        <span class="coverage-meter-value">${mapped} / ${total} <span class="coverage-meter-pct">(${pct}%)</span></span>
        <span class="coverage-meter-action">${viewHref ? `<a href="${viewHref}" title="${viewTitle || ""}">View →</a>` : ""}</span>
      </div>`;
  }

  // -- Hotel Star Ratings: a plain magnitude distribution, not a coverage
  // metric, so bars share one flat color rather than the tier scale above
  // (there's no "good/bad" star rating). All buckets are shown even if a
  // rating has zero hotels, so the shape of the full scale is visible.
  // Rating 0 is a real category, not "unrated" — hotels with no formal star
  // rating (e.g. serviced apartments) are classed "SC", listed after 1 Star
  // rather than as a highest-to-lowest numeric bucket.
  const starRatingCounts = [5, 4, 3, 2, 1, 0].map((stars) => ({
    stars,
    label: stars === 0 ? "SC" : `${stars} Star`,
    count: SYSTEM_HOTELS.filter((h) => h.starRating === stars).length,
  }));
  document.getElementById("starRatingList").innerHTML = starRatingCounts
    .map(({ label, count }) => {
      const pct = SYSTEM_HOTELS.length ? Math.round((count / SYSTEM_HOTELS.length) * 100) : 0;
      return `
        <div class="star-rating-row">
          <span class="star-rating-label">${label}</span>
          <span class="star-rating-track">
            <span class="star-rating-fill" style="width:${pct}%"></span>
          </span>
          <span class="star-rating-value">${count} hotels (${pct}%)</span>
        </div>`;
    })
    .join("");

  // -- Supplier mapping-summary cards (System/Country/City/Hotel counts +
  // mapping counts per supplier), paginated independently of every other
  // list on this page via a small local pager (reuses getPageList() from
  // js/app.js for page-number generation, but skips the rows-per-page
  // dropdown renderPagination() bundles in — a handful of supplier cards
  // doesn't need a variable page size the way a data table does).
  // Fixed hue order for the supplier avatar badges — pulled from the app's
  // existing non-status brand colors (never the success/warning/red trio,
  // which the meter bars below already use for coverage severity; reusing
  // them here would make a red avatar look like a coverage warning).
  const SUPPLIER_AVATAR_CLASSES = ["avatar-blue", "avatar-cyan", "avatar-navylight", "avatar-navy"];

  function computeSupplierSummary(key, index) {
    const countryRows = supplierCountries[key] || [];
    const cityRows = supplierCities[key] || [];
    const hotelRows = supplierHotels[key] || [];
    const country = { total: countryRows.length, mapped: countryRows.filter((r) => r.systemCountry != null).length };
    const city = { total: cityRows.length, mapped: cityRows.filter((r) => r.systemCityId != null).length };
    const hotel = {
      total: hotelRows.length,
      mapped: hotelRows.filter((r) => Boolean(findSystemHotelByProviderId(r.providerId))).length,
    };
    const totalAll = country.total + city.total + hotel.total;
    const mappedAll = country.mapped + city.mapped + hotel.mapped;
    return {
      key,
      label: SUPPLIER_LABELS[key],
      avatarClass: SUPPLIER_AVATAR_CLASSES[index % SUPPLIER_AVATAR_CLASSES.length],
      overallPct: totalAll ? Math.round((mappedAll / totalAll) * 100) : 0,
      country,
      city,
      hotel,
    };
  }

  const supplierSummaries = Object.keys(SUPPLIER_LABELS).map(computeSupplierSummary);

  // Every one of these destination pages (country-supplier.html,
  // city-supplier.html, hotel-supplier.html) already supports a
  // `?supplier=<key>` deep link that pre-selects that supplier in its own
  // Supplier dropdown — reused here so a card's links land already scoped
  // to that supplier instead of an empty "pick a supplier" state. Every
  // row's View link points at the same Supplier List its label does — kept
  // deliberately uniform across Country/City/Hotel (View always means
  // "this supplier's own list for this entity"), not a mapping screen.
  function supplierCardHtml(s) {
    const overallTier = coverageTierClass(s.overallPct);
    return `
      <div class="supplier-summary-card">
        <div class="supplier-summary-header">
          <span class="supplier-summary-avatar ${s.avatarClass}">${s.label.charAt(0)}</span>
          <span class="supplier-summary-name">${s.label}</span>
          <span class="pill ${overallTier === "tier-good" ? "success" : overallTier === "tier-warn" ? "warning" : "danger"} supplier-summary-overall">${s.overallPct}% mapped</span>
        </div>
        <div class="supplier-summary-metrics">
          ${meterRowHtml(
            "Country",
            s.country.mapped,
            s.country.total,
            `country-supplier.html?supplier=${s.key}`,
            `country-supplier.html?supplier=${s.key}`,
            `View ${s.label}'s country list`,
            `View ${s.label}'s country list`
          )}
          ${meterRowHtml(
            "City",
            s.city.mapped,
            s.city.total,
            `city-supplier.html?supplier=${s.key}`,
            `city-supplier.html?supplier=${s.key}`,
            `View ${s.label}'s city list`,
            `View ${s.label}'s city list`
          )}
          ${meterRowHtml(
            "Hotel",
            s.hotel.mapped,
            s.hotel.total,
            `hotel-supplier.html?supplier=${s.key}`,
            `hotel-supplier.html?supplier=${s.key}`,
            `View ${s.label}'s hotel list`,
            `View ${s.label}'s hotel list`
          )}
        </div>
      </div>`;
  }

  function renderCardPagination(container, { total, page, pageSize, onChange }) {
    const totalPages = Math.max(1, Math.ceil(total / pageSize));
    const start = total === 0 ? 0 : (page - 1) * pageSize + 1;
    const end = Math.min(page * pageSize, total);
    const pages = getPageList(page, totalPages);
    container.innerHTML = `
      <div class="pagination-info">Showing <strong>${start}</strong> - <strong>${end}</strong> of <strong>${total}</strong> suppliers</div>
      <div class="pagination-controls">
        <button class="page-btn nav" data-page="${page - 1}" title="Previous page" ${page === 1 ? "disabled" : ""}>&laquo; Previous</button>
        ${pages
          .map((p) =>
            p === "..."
              ? `<span class="page-ellipsis">&hellip;</span>`
              : `<button class="page-btn ${p === page ? "active" : ""}" data-page="${p}" title="Go to page ${p}">${p}</button>`
          )
          .join("")}
        <button class="page-btn nav" data-page="${page + 1}" title="Next page" ${page === totalPages ? "disabled" : ""}>Next &raquo;</button>
      </div>`;
    container.querySelectorAll(".page-btn[data-page]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        onChange({ page: parseInt(btn.dataset.page, 10) });
      });
    });
  }

  const supplierPageState = { page: 1, pageSize: 2 };

  function renderSupplierPage() {
    const total = supplierSummaries.length;
    const totalPages = Math.max(1, Math.ceil(total / supplierPageState.pageSize));
    supplierPageState.page = Math.min(Math.max(1, supplierPageState.page), totalPages);
    const start = (supplierPageState.page - 1) * supplierPageState.pageSize;
    const pageItems = supplierSummaries.slice(start, start + supplierPageState.pageSize);

    document.getElementById("supplierSummaryList").innerHTML = pageItems.map(supplierCardHtml).join("");
    renderCardPagination(document.getElementById("supplierPaginationBar"), {
      total,
      page: supplierPageState.page,
      pageSize: supplierPageState.pageSize,
      onChange: ({ page }) => {
        supplierPageState.page = page;
        renderSupplierPage();
      },
    });
  }

  renderSupplierPage();

  // -- Needs Attention: two curated highlight lists computed from data
  // already gathered above, not a general-purpose alert system — capped at
  // 3 rows each so this stays a quick scan, not another full table.
  function attentionItemHtml(tier, boldText, restText, pillText, href, linkTitle) {
    return `
      <div class="attention-item">
        <svg class="attention-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.3 4.6L2.9 17.5a1.8 1.8 0 001.6 2.7h15a1.8 1.8 0 001.6-2.7L13.7 4.6a1.8 1.8 0 00-3.4 0z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        <div class="attention-body">
          <span class="attention-text"><strong>${boldText}</strong> ${restText}</span>
          <span class="pill ${tier === "tier-good" ? "success" : tier === "tier-warn" ? "warning" : "danger"} attention-pill">${pillText}</span>
        </div>
        <a class="attention-link" href="${href}" title="${linkTitle || ""}">View →</a>
      </div>`;
  }

  // Lowest mapping coverage: flatten every supplier x entity combo already
  // computed in supplierSummaries into one list, worst percentage first.
  const coverageCombos = supplierSummaries.flatMap((s) => [
    { supplierLabel: s.label, entityLabel: "Country", ...s.country, href: `country-supplier.html?supplier=${s.key}` },
    { supplierLabel: s.label, entityLabel: "City", ...s.city, href: `city-supplier.html?supplier=${s.key}` },
    { supplierLabel: s.label, entityLabel: "Hotel", ...s.hotel, href: `hotel-supplier.html?supplier=${s.key}` },
  ]);
  coverageCombos.forEach((c) => (c.pct = c.total ? Math.round((c.mapped / c.total) * 100) : 0));
  coverageCombos.sort((a, b) => a.pct - b.pct);
  const lowestCoverageHtml = coverageCombos
    .slice(0, 3)
    .map((c) =>
      attentionItemHtml(
        coverageTierClass(c.pct),
        c.supplierLabel,
        `— ${c.entityLabel} mapping is the lowest in the system`,
        `${c.pct}% mapped`,
        c.href,
        `View ${c.supplierLabel}'s ${c.entityLabel} list`
      )
    )
    .join("");

  // Inactive hotels per supplier — the only entity with real active/inactive
  // variance in this data (system records and other supplier entities are
  // effectively always active), worst count first.
  const inactiveHotelCounts = Object.keys(SUPPLIER_LABELS)
    .map((key) => {
      const rows = supplierHotels[key] || [];
      const inactive = rows.filter((h) => !h.active).length;
      return {
        label: SUPPLIER_LABELS[key],
        inactive,
        total: rows.length,
        pct: rows.length ? Math.round((inactive / rows.length) * 100) : 0,
        href: `hotel-supplier.html?supplier=${key}`,
      };
    })
    .filter((s) => s.inactive > 0)
    .sort((a, b) => b.inactive - a.inactive);
  const inactiveHotelsHtml = inactiveHotelCounts
    .slice(0, 3)
    .map((s) =>
      attentionItemHtml(
        s.pct >= 15 ? "tier-low" : "tier-warn",
        s.label,
        `has ${s.inactive} inactive hotel${s.inactive === 1 ? "" : "s"}`,
        `${s.pct}% inactive`,
        s.href,
        `View ${s.label}'s hotel list`
      )
    )
    .join("");

  document.getElementById("attentionList").innerHTML = `
    <p class="attention-group-title">Lowest Mapping Coverage</p>
    ${lowestCoverageHtml || '<p class="attention-empty">Nothing stands out — coverage looks even across suppliers.</p>'}
    <p class="attention-group-title">Inactive Hotels</p>
    ${inactiveHotelsHtml || '<p class="attention-empty">No inactive hotels found.</p>'}
  `;
</script>
</body>
</html>
