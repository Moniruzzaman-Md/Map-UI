      <template id="cityListInfo">
        <p>This page manages the <strong>master list of cities</strong> used across the system.</p>
        <ul>
          <li><strong>ID</strong> — a unique, system-generated identifier. Not editable.</li>
          <li><strong>+ Add City</strong> — opens a drawer to add a single city under a country. Country is required. State is required for US and Canada, and unavailable for the rest. The name is required. On save the newly added city and its country are set on the filter.</li>
          <li><strong>Edit</strong> — reopen the same drawer to change a city's details. The country cannot be changed. For a city added here, the state can be changed; for a city from the original master list, it cannot.</li>
          <li>Nothing you type or pick filters the list right away — click <strong>Search</strong> (or press Enter in the search box) to apply it. Click <strong>Filters</strong> to reveal Country, State, Status and Custom cities only; State opens up once a Country is picked. While collapsed, anything you've set shows as a removable chip — click a chip's × to clear just that one filter. <strong>Reset</strong> clears everything and shows the full list immediately, no Search needed.</li>
          <li><strong>Custom cities only</strong> — tick to show just the cities added through Add City. Untick to show every city. It combines with the other filters and the search.</li>
          <li><strong>Map</strong> — jump to City Mapping with this city already pinned, to map supplier cities to it. Available for every city.</li>
          <li><strong>Hotels</strong> — jump to the System Hotel List with Country/State/City already filtered (and searched) to this city, showing every hotel assigned to it.</li>
          <li><strong>History</strong> — view every change: creation, renames, state changes, status changes, plus supplier cities and hotels mapped or unmapped to this city.</li>
          <li><strong>Summary</strong> — a quick review of what is mapped to this city, in one wide popup. A single row of tabs runs across the top: <strong>Hotels</strong> first, then a <strong>tab per supplier</strong>. Hotels stays in place; the supplier tabs scroll sideways after it, between the arrows at either end of that group, when there are more than fit — or type in <strong>Find supplier</strong> at the end of the row to narrow them to matching names. Nothing is selected when the popup opens: pick Hotels or the supplier you want and its list is fetched then. Each table is paged the same way as the lists elsewhere in the system — <strong>Previous/Next</strong> and <strong>Rows</strong> below it. A green or red bar down a row's left edge is that hotel's or supplier city's Active/Inactive status. On the Hotels tab, <strong>Relation Type</strong> says whether this city is that hotel's <strong>Primary</strong> city or a <strong>Secondary</strong> one — a hotel belongs to several cities but only one of them is its primary, so the same hotel reads Primary here and Secondary in the summary of another city it is mapped to.</li>
          <li><strong>Active/Inactive toggle</strong> — controls whether a city is available for booking.</li>
        </ul>
      </template>

      <template id="cityListDevNotes">
        <p>This is the master list of system cities. Every record here is the same kind of thing — there is no <code>cityType</code>, no New/Merged/Custom status, and therefore no per-type branching in any action. A city added via Add City behaves exactly like one that shipped in the seed data everywhere it matters — same actions, same mapping rules (a system city is never mapped to another system city) — with a single deliberate exception: its State stays editable, see Add / Edit below.</p>
        <ul>
          <li><strong>ID</strong> — permanent, system-generated, never editable.</li>
          <li><strong>Add / Edit</strong> — one drawer (<code>#cityFormModal</code>) serves both, same dual-mode <code>openCityForm(record)</code> pattern as <code>hotel-system.html</code>'s <code>openHotelForm()</code>: pass a record to edit, pass nothing to add. Country/State are live cascading selects while adding; the ID row is hidden entirely in add mode. <strong>State is required</strong> whenever the chosen country is one the system holds states for, and is unavailable for every other country — a city's state is part of the record, not a narrowing filter, so this is the one State control in the project that is mandatory rather than optional. The same check runs on save while editing, so a state that can be edited can never be cleared back to none. While editing, Country is always disabled — a city's country is permanent once the record exists — but <strong>State stays editable for a city that was added through this drawer</strong>, since that state was chosen from this drawer's own State select when the record was created. A seeded city's State is disabled. This is read off the record's history (<code>wasAddedInApp()</code> — an added city always carries a <code>Create</code> entry, nothing else writes one) rather than a stored flag, so it doesn't reintroduce a stored city status and it covers cities added before the rule existed. A state change is logged into the same single <code>Edit</code> history entry as a name change made in the same save. There is no separate Add City page — <code>?add=1</code> opens the drawer on load, which is what the Dashboard's own Add shortcut links to. After an add, the list's search is set to the new city's name <em>and</em> the Country filter to that city's country, so the created row is actually visible rather than buried on the last page behind whatever filters were active — name plus country is also what a real backend query needs to narrow on, where a bare name search would scan every country. State is rebuilt for the new country but left on All, and Status is reset to All.</li>
          <li><strong>Filters</strong> — nothing in the toolbar re-queries the list on its own; every field only updates the pending state, the live Filters count pill, and the chip summary shown while the panel is collapsed. The list re-queries on <strong>Search</strong>, on Enter in the search box, or on <strong>Reset</strong> — Reset bypasses the wait-for-Search gate, since "start over" showing the previous filter's results would be a lie. Clearing a chip is a pending change like any other. Country/State is the usual cascade: State is gated behind Country and is rebuilt the moment Country changes, because it's a dependent control rather than a result.</li>
          <li><strong>Custom cities only</strong> — a single on/off narrowing to the cities added through the Add City drawer; there is deliberately no "original only" counterpart, since unticking already answers that. It must use the exact same <code>wasAddedInApp()</code> history derivation the Edit drawer's State rule uses, never a second definition of "custom" — one derivation means the filter and the editability rule can never disagree about a given city. This is a filter over an <em>observable fact about a record's history</em>, not the return of the deleted city-status system: nothing is stored on the city, nothing branches on it beyond these two places, and the list rows carry no custom/original badge. <code>?customOnly=1</code> lands with it already ticked. Reset, and the post-add filter clearing, both untick it — the row an add just created must never be filtered out of view by a filter the user didn't set for that purpose.</li>
          <li><strong>Map</strong> (<code>city-mapping.html?cityId=X</code>) — every city is a valid mapping target.</li>
          <li><strong>Hotels</strong> (<code>hotel-system.html?cityId=X</code>) — deep-links to the System Hotel List with Country/State/City pre-filled from this city and the search already run (collapsing that page's own Filters panel, same as if the user had set those 3 filters and pressed Search themselves).</li>
          <li><strong>History</strong> — every entry has an <strong>operation name</strong>, a <strong>description</strong>, and <strong>who + when</strong>, logged the instant the change happens, newest first: <strong>Create</strong> (initial fields), <strong>Edit</strong> (a rename), <strong>Status Change</strong> (Active/Inactive). A supplier city or hotel mapped or unmapped to this city also logs here, on this city's own record, in the same action as that entity's own history entry.</li>
          <li><strong>Summary</strong> — a read-only review of everything mapped to this city, read from live data every time it opens, never from a stored snapshot. It is a <strong>wide centred popup</strong> (<code>.popup-box-lg</code>, the size the save previews use), not this project's usual right drawer: it carries a tab per supplier plus a paginated table, and a ~360px drawer could only ever show a sliver of that. It stays a popup rather than a page of its own — this is a glance at one row, not a place to work. Nothing in it writes; mapping and unmapping belong on the mapping screen, against a pinned city.
            <ul>
              <li><strong>One tab row over one panel</strong> — hotels and every supplier are the same question asked of different sources, so they are tabs, not stacked sections: only one list is ever on screen, and the popup never grows taller than the list it is showing. <strong>Hotels is pinned outside the scrolling strip</strong>, with a divider after it — it is not one of the suppliers, and it must stay reachable however far the strip is scrolled. <strong>Find supplier</strong> is pinned at the other end for the same reason. Only the middle scrolls. The row sits <strong>flush under the popup header</strong> — the body's usual top padding is dropped here, since it would only put an empty band above the tabs — and is sticky, so the tabs stay put while a long table scrolls under them.</li>
              <li><strong>Opening this popup must cost nothing.</strong> No tab carries a count, nothing is selected, and no source is read until the user picks a tab — the first lookup happens on that click, against that one source. This is the rule the rest of the popup's design follows from, and it is a consequence of how the data actually sits: <strong>suppliers are independent sources with independent storage</strong>, and the supplier list itself comes from configuration the app already holds, not from a query. So "which suppliers have rows for this city" is not one question, it is one question per supplier — 54 lookups today and more with every supplier onboarded, paid on every open, purely to decide which tabs look worth clicking. A count is worth its query when it changes what the user does next; here the user arrives already knowing whether they want the hotels or a named supplier, so it changes nothing. The earlier version labelled every tab with its own count, greyed out the empty ones and auto-opened the first supplier that had rows — all three are gone with the counts that fed them.</li>
              <li><strong>Hotels</strong> — every hotel attached to this city, whether via the hotel's own city field or the Map overlay, <strong>deduped by hotel id</strong>: a hotel can legitimately satisfy both (its home city already is this city and it was also separately mapped), and it must never be listed twice. Fetched when its tab is opened, like every other tab — a busy city can carry thousands of hotels, so nothing about them is read while the popup is merely open.</li>
              <li><strong>Relation Type</strong> — a hotel belongs to several cities and exactly one of them is its <strong>primary</strong>, so each row says whether <em>this</em> city is that hotel's Primary or a Secondary one. The value describes <strong>the pair, not the hotel</strong>: the same hotel is Primary in one city's summary and Secondary in every other city it is mapped to, which is why the column exists only in this per-city view and only on the Hotels tab — supplier cities are a flat set with no primary among them. Read today from which field holds the city (the hotel's own <code>systemCityId</code> is primary, an entry in its mapped cities is secondary); when that pair becomes a join row carrying its own flag, only the read changes and the column stays as it is. A hotel that somehow satisfies both — its own city also listed among its mapped ones, which is redundant data — is listed once, as Primary: that is the stronger of the two claims.</li>
              <li><strong>Supplier tabs</strong> — one per supplier, drawn from the supplier list itself and therefore built once rather than per city. Nothing distinguishes them until one is opened; whether a supplier has anything for this city is only knowable by asking it, so an empty answer arrives as an empty state in the panel, after a load, exactly like a non-empty one. The strip must survive a realistic supplier count: fixed-width tabs on one scrolling line, never wrapping — wrapping puts dozens of tabs on six rows and pushes the list itself off-screen, and makes the strip's height jump as it filters. It uses the <strong>same strip as the City Mapping screen</strong> — a scroll arrow at each end of the supplier group, appearing only once the tabs actually overflow, with the scrollbar itself hidden. The filter must never hide the tab currently being shown, must still report "no match" when the query matches nothing, and must survive a tab selection — which is why selecting a tab toggles classes rather than rebuilding the strip. It also never touches the pinned Hotels tab. The filter box is cleared on every open, so a query left over from the last city can't silently hide suppliers in this one.</li>
              <li><strong>Ordinary project tables</strong> — the lists render as <code>.data-table</code>, the same table every list page uses, with one addition: a leading <strong>#</strong> column, since a row's position in the list is part of what this popup is being read for. Its sticky header stops <em>below</em> the sticky tab row rather than sliding under it — the row publishes its measured height for the header to offset against, because that height depends on which of the tabs and the search box is taller. <code>.table-wrap</code> drops its own scrolling here: a nested scroller would both break the one-scrolling-surface rule and stop the header sticking at all, since a <code>&lt;thead&gt;</code> sticks to its own scrollport.</li>
              <li><strong>Numbered pages, not scroll-to-load</strong> — each table carries <code>renderPagination()</code>'s standard footer, the same one every list page in this project uses: Showing x-y of n, page buttons, and a Rows selector. The mapping screens' scroll-triggered loading is deliberately <em>not</em> used here — those are working surfaces where a row is picked out of a stream, this is a table being read, and a reader who wants row 200 should be able to ask for it rather than scroll to it. The footer is <strong>pinned to the bottom edge of the popup</strong>, a sibling of the scrolling body rather than a trailing element inside it — exactly the relationship <code>.content-card</code> gives its own footer on every list page, so the controls stay put instead of drifting up under a short list or scrolling away under a long one. It goes blank while a tab loads (page numbers under a spinner would describe a list that isn't on screen) and hides entirely on a tab with no rows, so its border can't float under an empty state. Changing tab resets to page 1 (a page number means nothing once the rows underneath it are a different list) while the chosen Rows value carries over, since that is a preference about how the reader wants to read. Note <code>renderPagination()</code> hardcodes an id on its Rows select, so the copy rendered inside this popup is re-keyed after render — two elements sharing an id would point this popup's label at the select on the page behind it.</li>
              <li><strong>Status is a colored left edge, not a column</strong> — a green or red bar on the row's left edge, the same signal the mapping screens' candidate rows carry, taken out of the first cell's own padding so nothing shifts between an active and an inactive row. A Status column of identical pills is a column of chrome in a table where every other column actually differs row to row. Cells are middle-aligned, so a two-line cell (a supplier's country name over its own identifier) sits level with the single-line cells beside it.</li>
              <li><strong>One scrolling surface</strong> — the <strong>popup body</strong> is the only thing that scrolls; the table inside it is full height. A list with its own scrolling box means two scrollbars competing for the same gesture, and a short list leaves dead space under it while the box keeps its height. Every open starts at the top, however far the last city's list had been scrolled.</li>
              <li><strong>Loading, and stale responses</strong> — every list must render a <strong>loading state</strong> before its rows, not appear instantly: each one stands for a query, and a list that materialises with no perceptible fetch teaches an expectation a real backend will break. That state is <strong>the table that is coming</strong> — the real header with this tab's own columns, and rows of shimmering bars where the values will be — not a spinner beside the word "Loading". The columns are known before the lookup runs, so it costs nothing extra, and the placeholder and the result occupy the same shape, which is what stops the panel jumping when the rows land. The shimmer is decoration: the block carries <code>aria-busy</code> for the announcement, and the animation stops entirely under <em>prefers-reduced-motion</em>. A stale response must never overwrite a newer one — clicking through tabs faster than the fetch resolves has to land the tab clicked last.</li>
            </ul>
          </li>
          <li><strong>Active/Inactive toggle</strong> — applies immediately, no confirmation, logged to History as a Status Change.</li>
        </ul>
        <p><strong>Everywhere:</strong> key every relationship by permanent id, never by an editable name, and resolve a city's country/state live (via its country code) rather than trusting a name snapshot that might be stale after a rename elsewhere.</p>
      </template>

            </button>
            <button class="btn btn-danger" id="resetCityFilterBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 3.5V8h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Reset
            </button>
            <label class="toggle-row" for="cityRevealValuesToggle" style="margin-bottom:0;">
              <input type="checkbox" id="cityRevealValuesToggle" />
              Show full values
            </label>
            <!-- Pushed to the far right: adding a city isn't part of the
                 find-something-in-the-list group to its left. -->
            <button class="btn btn-primary toolbar-push-right" id="addCityBtn">+ Add City</button>
          </div>

          <!-- Shown only while the panel below is collapsed and at least one of
               its filters is active, so a collapsed filter set isn't silently
               invisible — see updateFiltersSummary(). Same pattern as
               hotel-system.html / hotel-supplier.html. -->
          <div class="filters-summary" id="cityFiltersSummary" style="display:none;"></div>

          <!-- Collapsed by default: the Country/State/Status selects and the
               custom-cities toggle, moved out of the always-visible row. -->
          <div class="filters-panel" id="cityFiltersPanel" style="display:none;">
            <div class="filter-field">
              <label for="cityCountryFilter">Country</label>
              <select class="filter-select" id="cityCountryFilter">
                <option value="">All Countries</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="cityStateFilter">State</label>
              <select class="filter-select" id="cityStateFilter" disabled>
                <option value="">Select State</option>
              </select>
            </div>
            <div class="filter-field">
              <label for="cityStatusFilter">Status</label>
              <select class="filter-select" id="cityStatusFilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
            <!-- "Custom" means added through this page's Add City drawer, as
                 opposed to shipping in the original master list. Read off the
                 record's own history, not a stored city type. A checkbox
                 rather than a dropdown: it's one on/off narrowing, and there
                 is deliberately no "original only" counterpart. -->
            <div class="filter-field filter-field--toggle">
              <label class="toggle-row" for="cityCustomFilter" style="margin-bottom:0;">
                <input type="checkbox" id="cityCustomFilter" />
                Custom cities only
              </label>
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table" id="cityTable">
            <thead>
              <tr>
                <th style="width:15%">ID</th>
                <th style="width:13%">Name</th>
                <th style="width:13%">State</th>
                <th style="width:20%">Country</th>
                <th style="width:10%">Status</th>
                <th style="width:29%">Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- rows injected here -->
            </tbody>
          </table>
        </div>

        <div class="table-footer pagination-bar" id="paginationBar"></div>
      </section>
    </main>
  </div>
</div>

<!-- Add / Edit City drawer — one modal serving both, same dual-mode pattern
     as hotel-system.html's #hotelFormModal. Add mode: ID row hidden,
     Country/State live selects (State cascades off Country and stays
     disabled for countries that have none). Edit mode: ID shown, Country
     always disabled — a city's country is permanent — and State editable
     only for a city that was added through this drawer, so a just-added
     city's state can still be corrected while a seeded city's stays put. -->
<div class="modal-overlay" id="cityFormModal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="cityFormTitle">Add City</h3>
      <button class="modal-close" data-modal-close aria-label="Close">

      </button>
    </div>
    <div class="modal-body">
      <div class="form-group" id="cityFormIdGroup">
        <label for="cityFormId">ID</label>
        <input type="text" id="cityFormId" disabled />
      </div>
      <div class="form-group">
        <label for="cityFormCountry">Country</label>
        <select id="cityFormCountry" class="filter-select" style="width:100%; min-width:0;">
          <option value="">Select country</option>
        </select>

      <div class="form-group">
        <label for="cityFormState">State</label>

</div>

<!-- Edit History Modal (card design) -->
<div class="modal-overlay" id="historyModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit History <span id="historyCityName" style="color:var(--text-muted); font-weight:600;"></span></h3>
      <button class="modal-close" data-modal-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="history-list" id="historyList"></div>
    </div>
  </div>
</div>

<!-- Mapping Summary — a wide centred popup, not the project's usual right
     drawer: it carries a full supplier tab strip and two paginated tables,
     which a ~360px drawer could only show a sliver of at a time. Same
     .popup-box-lg the save previews use, for the same reason. -->
<div class="modal-overlay popup-overlay" id="summaryModal">
  <div class="popup-box popup-box-lg">
    <div class="modal-header">
      <h3>Mapping Summary <span id="summaryCityName" style="color:var(--text-muted); font-weight:600;"></span></h3>
      <button class="modal-close" data-modal-close aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">

      <!-- One tab row for the whole summary: Hotels is pinned at the left
           and never scrolls away, the supplier tabs scroll sideways after
           it between the same arrows city-mapping.html's strip uses, and
           Find supplier is pinned at the right end. Only the suppliers
           scroll — the things that must always be reachable are the ones
           the row keeps in place. The row sits flush under the popup header
           and sticks there, so the tabs stay put while a long table scrolls
           under them. -->
      <div class="summary-tabs-bar">
        <button type="button" class="supplier-tab summary-hotels-tab" role="tab" aria-selected="false" data-summary-tab="hotels">
          <span class="supplier-tab-label">Hotels</span>
        </button>
        <button type="button" class="supplier-tabs-arrow" id="summaryTabsPrev" aria-label="Scroll suppliers left" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="supplier-tabs" id="summarySupplierTabs" role="tablist" aria-label="Supplier">
          <!-- "No supplier matches that name" belongs on the strip's own
               line, not under it: when the filter matches nothing, this line
               is what the strip has to show, and a message below an empty
               strip leaves a blank row standing where the answer should be.
               It is a static child here, which is why the tab render below
               uses insertAdjacentHTML rather than innerHTML. -->
          <div class="supplier-tabs-empty" id="summarySupplierEmpty" hidden>No supplier matches that name</div>
        </div>
        <button type="button" class="supplier-tabs-arrow" id="summaryTabsNext" aria-label="Scroll suppliers right" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="toolbar-search summary-supplier-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" id="summaryTabsSearch" placeholder="Find supplier..." />
        </div>
      </div>
      <div id="summaryPanelBody"></div>
    </div>

    <!-- Outside .modal-body on purpose: the footer belongs to the popup,
         not to the list inside it, so it stays pinned to the bottom edge
         while the table scrolls — the same relationship .content-card gives
         its own table footer on every list page. -->
    <div class="table-footer pagination-bar" id="summaryPaginationBar"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/data.js"></script>
<script>
  const countryFilterSelect = document.getElementById("cityCountryFilter");
  countryFilterSelect.insertAdjacentHTML(
    "beforeend",
    SYSTEM_COUNTRIES.map((c) => `<option value="${c.name}">${c.name} (${c.code})</option>`).join("")
  );

  const stateFilterSelect = document.getElementById("cityStateFilter");
  const statusFilterSelect = document.getElementById("cityStatusFilter");
  const customFilterToggle = document.getElementById("cityCustomFilter");
  const tbody = document.querySelector("#cityTable tbody");
  const paginationBar = document.getElementById("paginationBar");
  const citySearch = document.getElementById("citySearch");
  const cityTableEl = document.getElementById("cityTable");
  const revealValuesToggle = document.getElementById("cityRevealValuesToggle");

  let state = { page: 1, pageSize: 10, query: "", country: "", cityState: "", status: "all", customOnly: false };

  function getFiltered() {
    let rows = SYSTEM_CITIES;
    const q = state.query.trim().toLowerCase();
    if (q) rows = rows.filter((c) => c.name.toLowerCase().includes(q));
    if (state.country) rows = rows.filter((c) => (getSystemCountryName(c.country.code) || c.country.name) === state.country);
    if (state.cityState) rows = rows.filter((c) => c.state === state.cityState);
    if (state.status === "active") rows = rows.filter((c) => c.active);
    if (state.status === "inactive") rows = rows.filter((c) => !c.active);
    // Custom = added here via Add City. Same wasAddedInApp() derivation the
    // Edit drawer uses for its State field, so the two can never disagree
    // about which cities count as custom.
    if (state.customOnly) rows = rows.filter((c) => wasAddedInApp(c));
    return rows;
  }

  function render() {
    const filtered = getFiltered();
    const totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
    state.page = Math.min(state.page, totalPages);
    const startIdx = (state.page - 1) * state.pageSize;
    const pageItems = filtered.slice(startIdx, startIdx + state.pageSize);

    tbody.innerHTML = pageItems.length
      ? pageItems
          .map(
            (c) => `
      <tr data-row-id="${c.id}">
        <td style="white-space:nowrap"><div class="code-badge truncatable truncatable--badge-value" title="${getSystemCityDisplayId(c.id)}"><span class="truncatable-text">${getSystemCityDisplayId(c.id)}</span></div></td>
        <td data-col="name">
          <div class="city-name-cell">
            <div class="truncatable truncatable--cell-text" title="${c.name}"><span class="truncatable-text">${c.name}</span></div>
          </div>
        </td>
        <td>${c.state ? `<div class="truncatable truncatable--cell-text" title="${c.state}"><span class="truncatable-text">${c.state}</span></div>` : '<span style="color:var(--text-muted)">—</span>'}</td>
        <td>
          <div class="system-country-cell">
            <span class="code-badge">${c.country.code}</span>
            <span class="truncatable truncatable--country" title="${getSystemCountryName(c.country.code) || c.country.name}"><span class="truncatable-text">${getSystemCountryName(c.country.code) || c.country.name}</span></span>
          </div>
        </td>
        <td><span class="pill ${c.active ? "success" : "danger"}">${c.active ? "Active" : "Inactive"}</span></td>
        <td>
          <div class="row-actions">
            <button class="action-btn" data-edit-btn data-row-id="${c.id}" aria-label="Edit ${c.name}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </button>
            <a class="action-btn" href="city-mapping.html?cityId=${c.id}" target="_blank" rel="noopener" aria-label="Map supplier cities to ${c.name}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M9 17l-4.5 2V7L9 5m0 12l6 2m-6-2V5m6 14l4.5-2V5L15 7m0 12V7m0 0L9 5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </a>
            <a class="action-btn" href="hotel-system.html?cityId=${c.id}" target="_blank" rel="noopener" aria-label="View hotels in ${c.name}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 21V10l8-5 8 5v11" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 21v-6h6v6" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12h.01M15 12h.01M12 8h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </a>
            <button class="action-btn" data-history-btn data-row-id="${c.id}" aria-label="View edit history for ${c.name}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M3 3.5V8h4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.5V12l3.2 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="action-btn" data-summary-btn data-row-id="${c.id}" aria-label="View mapping summary for ${c.name}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.6"/></svg>
            </button>
            <button class="action-btn" data-toggle-active-btn data-row-id="${c.id}" aria-label="${c.active ? "Deactivate" : "Activate"} ${c.name}">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 2v10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 5a8 8 0 106.5-1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
          </div>
        </td>
      </tr>`
          )
          .join("")
      : `<tr><td colspan="6" class="empty-state">No cities found</td></tr>`;

    renderPagination(paginationBar, {
      total: filtered.length,
      page: state.page,
      pageSize: state.pageSize,
      onChange: ({ page, pageSize }) => {
        state.page = page;
        state.pageSize = pageSize;
        render();
      },
    });

    refreshValueOverflowState();
    // Keeps the count pill and chips honest after any bulk state change
    // (Search, Reset, the post-add filter set), not just after a field edit.
    updateFiltersSummary();
  }

  // Re-measures every .truncatable cell after each render() — only cells
  // whose content genuinely doesn't fit their column get .is-overflowing
  // (and therefore the fade via CSS), same mechanism as
  // country-system.html's own copy of this function.
  function refreshValueOverflowState() {
    document.querySelectorAll("#cityTable .truncatable").forEach((el) => {
      el.classList.toggle("is-overflowing", el.scrollWidth > el.clientWidth + 1);
    });
  }

  revealValuesToggle.addEventListener("change", () => {
    cityTableEl.classList.toggle("reveal-values", revealValuesToggle.checked);
    refreshValueOverflowState();
  });

  // ---------- Filters: pending until Search ----------
  // Same model as hotel-system.html / hotel-supplier.html: every field below
  // only updates `state` plus the Filters count pill and the collapsed
  // summary chips. The table itself re-queries on Search, Enter in the
  // search box, or Reset — never on a keystroke or a dropdown change — so a
  // multi-field filter set is applied in one go instead of the list
  // reshuffling under the user between picks.

  citySearch.addEventListener("input", () => {
    state.query = citySearch.value;
    updateFiltersSummary();
  });

  countryFilterSelect.addEventListener("change", () => {
    state.country = countryFilterSelect.value;
    state.cityState = "";

    const countryMeta = SYSTEM_COUNTRIES.find((c) => c.name === state.country);
    const states = countryMeta ? getStatesForCountryCode(countryMeta.code) : [];

    // The State select is rebuilt immediately even though nothing re-queries
    // yet — it's a dependent control, not a result: leaving stale options
    // from the previous country would let the user pick a state that country
    // doesn't have.
    if (states.length) {
      stateFilterSelect.disabled = false;
      stateFilterSelect.innerHTML =
        `<option value="">All States</option>` + states.map((s) => `<option value="${s}">${s}</option>`).join("");
    } else {
      stateFilterSelect.disabled = true;
      stateFilterSelect.innerHTML = `<option value="">Select State</option>`;
    }
    updateFiltersSummary();
  });

  stateFilterSelect.addEventListener("change", () => {
    state.cityState = stateFilterSelect.value;
    updateFiltersSummary();
  });

  statusFilterSelect.addEventListener("change", () => {
    state.status = statusFilterSelect.value;
    updateFiltersSummary();
  });

  customFilterToggle.addEventListener("change", () => {
    state.customOnly = customFilterToggle.checked;
    updateFiltersSummary();
  });

  const cityFiltersToggleBtn = document.getElementById("cityFiltersToggleBtn");
  const cityFiltersPanel = document.getElementById("cityFiltersPanel");
  const cityFiltersSummary = document.getElementById("cityFiltersSummary");
  const cityActiveFilterCount = document.getElementById("cityActiveFilterCount");

  // Human-readable label + value for every pending filter, keyed the same
  // way getFiltered() reads them — drives both the count pill and the chips.
  function activeFilterEntries() {
    const entries = [];
    if (state.query.trim()) entries.push({ key: "query", label: "Name", value: state.query.trim() });
    if (state.country) entries.push({ key: "country", label: "Country", value: state.country });
    if (state.cityState) entries.push({ key: "cityState", label: "State", value: state.cityState });
    if (state.status !== "all") entries.push({ key: "status", label: "Status", value: state.status === "active" ? "Active" : "Inactive" });
    if (state.customOnly) entries.push({ key: "customOnly", label: "Custom cities only", value: "Yes" });
    return entries;
  }

  // Clearing a chip only updates the pending state, like every other change
  // here — the table still waits for Search. Select-backed filters reuse
  // their own change handler by dispatching a real "change" rather than
  // duplicating the cascade logic.
  const FILTER_CLEARERS = {
    query: () => {
      state.query = "";
      citySearch.value = "";
      updateFiltersSummary();
    },
    country: () => {
      countryFilterSelect.value = "";
      countryFilterSelect.dispatchEvent(new Event("change"));
    },
    cityState: () => {
      stateFilterSelect.value = "";
      stateFilterSelect.dispatchEvent(new Event("change"));
    },
    status: () => {
      statusFilterSelect.value = "all";
      statusFilterSelect.dispatchEvent(new Event("change"));
    },
    customOnly: () => {
      customFilterToggle.checked = false;
      customFilterToggle.dispatchEvent(new Event("change"));
    },
  };

  cityFiltersSummary.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-clear-filter]");
    if (btn) FILTER_CLEARERS[btn.dataset.clearFilter]?.();
  });

  function updateFiltersSummary() {
    const entries = activeFilterEntries();

    cityActiveFilterCount.textContent = String(entries.length);
    cityActiveFilterCount.style.display = entries.length ? "" : "none";

    const isOpen = cityFiltersPanel.style.display !== "none";
    if (isOpen || !entries.length) {
      cityFiltersSummary.style.display = "none";
      cityFiltersSummary.innerHTML = "";
    } else {
      cityFiltersSummary.style.display = "";
      cityFiltersSummary.innerHTML = entries
        .map(
          (e) =>
            `<span class="filter-chip">${e.label}: ${e.value}<button type="button" data-clear-filter="${e.key}" aria-label="Clear ${e.label} filter">×</button></span>`
        )
        .join("");
    }
  }

  function setFiltersPanelOpen(open) {
    cityFiltersPanel.style.display = open ? "grid" : "none";
    cityFiltersToggleBtn.classList.toggle("open", open);
    cityFiltersToggleBtn.setAttribute("aria-expanded", String(open));
    updateFiltersSummary();
  }

  cityFiltersToggleBtn.addEventListener("click", () => {
    setFiltersPanelOpen(cityFiltersPanel.style.display === "none");
  });

  function runSearchNow() {
    state.page = 1;
    setFiltersPanelOpen(false);
    render();
  }

  document.getElementById("citySearchBtn").addEventListener("click", runSearchNow);
  citySearch.addEventListener("keydown", (e) => {
    if (e.key === "Enter") runSearchNow();
  });

  // Reset is the one control that re-queries without waiting for Search —
  // "start over" showing the previous filter's results would be a lie.
  document.getElementById("resetCityFilterBtn").addEventListener("click", () => {
    citySearch.value = "";
    countryFilterSelect.value = "";
    stateFilterSelect.disabled = true;
    stateFilterSelect.innerHTML = `<option value="">Select State</option>`;
    statusFilterSelect.value = "all";
    customFilterToggle.checked = false;
    state = { ...state, page: 1, query: "", country: "", cityState: "", status: "all", customOnly: false };
    render();
  });

  // ---------- Mapping Summary popup ----------
  // A wide centred popup rather than the usual drawer: it holds a tab strip
  // over every supplier plus two paginated tables, and the two of them
  // never fitted the ~360px drawer this replaced. Everything in it is read
  // from live data on open — nothing is stored, and nothing here writes.

  // Numbered pages with the project's own footer bar (renderPagination in
  // js/app.js), same as every list page here — not the scroll-to-load-more
  // convention the mapping screens' checklists use. Those are working
  // surfaces where a row is picked out of a stream; this is a table being
  // read, and the page/rows-per-page controls are what the rest of the
  // project reads tables with.
  const SUMMARY_PAGE_SIZE = 10;

  // Which page of the current tab's table is showing. Reset whenever the
  // tab or the city changes — a page number means nothing once the rows
  // underneath it are a different list.
  let summaryTableState = { page: 1, pageSize: SUMMARY_PAGE_SIZE };

  // Renders one page of `rows` plus the footer bar into `host`. Called
  // again by the footer's own handlers, so the table and its controls stay
  // in step without the caller having to re-render anything.
  function renderSummaryTable(host, rows, columns, rowHtml) {
    const totalPages = Math.max(1, Math.ceil(rows.length / summaryTableState.pageSize));
    summaryTableState.page = Math.min(summaryTableState.page, totalPages);
    const startIdx = (summaryTableState.page - 1) * summaryTableState.pageSize;
    const pageRows = rows.slice(startIdx, startIdx + summaryTableState.pageSize);

    // The project's own .data-table, same as every list page — the popup's
    // tables are read the same way, so they look the same way. The only
    // addition is the leading "#" column.
    host.innerHTML = `
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th class="table-num">#</th>
              ${columns.map((label) => `<th>${label}</th>`).join("")}
            </tr>
          </thead>
          <tbody>${pageRows.map((item, i) => rowHtml(item, startIdx + i)).join("")}</tbody>
        </table>
      </div>`;

    const bar = document.getElementById("summaryPaginationBar");
    renderPagination(bar, {
      total: rows.length,
      page: summaryTableState.page,
      pageSize: summaryTableState.pageSize,
      onChange: ({ page, pageSize }) => {
        summaryTableState = { page, pageSize };
        renderSummaryTable(host, rows, columns, rowHtml);
      },
    });

    // renderPagination() hardcodes id="pageSizeSelect", and this page
    // already has one in its own footer — two elements sharing an id means
    // the popup's "Rows" label would focus the select behind the modal.
    // Re-key this copy instead of forking the shared helper.
    const pageSizeSelect = bar.querySelector(".page-size-select");
    pageSizeSelect.id = "summaryPageSizeSelect";
    bar.querySelector('label[for="pageSizeSelect"]').setAttribute("for", "summaryPageSizeSelect");
  }

  // Active/Inactive as a colored left edge on the row rather than a Status
  // column — same green/red bar the mapping screens' candidate rows use,
  // and it buys back a whole column of width for the values that actually
  // differ from row to row.
  function summaryRowClass(active) {
    return active ? "summary-list-row--active" : "summary-list-row--inactive";
  }

  const SUMMARY_HOTEL_COLUMNS = ["Hotel", "ID", "Address", "Relation Type"];

  // `entry` is { hotel, primary } — the relation belongs to the pair, not to
  // the hotel, so the same hotel reads Primary in its own city's summary and
  // Secondary in every other city it is mapped to.
  function summaryHotelRowHtml({ hotel, primary }, i) {
    // Street address plus the resolved city/state/country: the street
    // address alone (hotel.address) reads as incomplete, and
    // resolveHotelLocation() never touches the street address itself.
    const loc = resolveHotelLocation(hotel);
    const countryLabel = getSystemCountryName(loc.country.code) || loc.country.name;
    return `
      <tr class="${summaryRowClass(hotel.active)}">
        <td class="table-num">${i + 1}</td>
        <td><div class="summary-list-name">${hotel.name}</div></td>
        <td style="white-space:nowrap"><span class="code-badge">${getSystemHotelDisplayId(hotel.id)}</span></td>
        <td>${[hotel.address, loc.city, loc.state, countryLabel].filter(Boolean).join(", ")}</td>
        <td><span class="pill ${primary ? "info" : "neutral"}">${primary ? "Primary" : "Secondary"}</span></td>
      </tr>`;
  }

  const SUMMARY_CITY_COLUMNS = ["City", "State", "Country", "Supplier City ID"];

  // Bound to a supplier key so the Country cell can show that supplier's own
  // name for the country (and its own identifier for it) rather than the
  // system's — those are the values that identify it in the supplier's feed.
  function summaryCityRowHtml(supplierKey) {
    return (city, i) => `
      <tr class="${summaryRowClass(city.active)}">
        <td class="table-num">${i + 1}</td>
        <td><div class="summary-list-name">${city.name}</div></td>
        <td>${city.state || '<span style="color:var(--text-muted)">—</span>'}</td>
        <td>
          <div>${getSupplierCountryName(supplierKey, city.countryCode)}</div>
          <div class="summary-list-meta">${getSupplierCountrySupplierId(supplierKey, city.countryCode)}</div>
        </td>
        <td style="white-space:nowrap"><span class="code-badge">${city.id}</span></td>
      </tr>`;
  }

  // Every list in this popup is a query in a real deployment — a city's
  // hotels, or one supplier's cities mapped to it — so each one shows a
  // loading state first rather than appearing instantly. The skeleton
  // itself, the delay and the stale-response guard are shared with every
  // other list in the project (withTableLoading/skeletonRowsHtml in
  // js/app.js); what's local here is the header, since each tab's table has
  // its own columns and this panel is empty until one is picked.
  function withSummaryLoading(host, columns, renderRows) {
    const skeleton = `
      <div class="table-wrap skeleton" aria-label="Loading">
        <table class="data-table">
          <thead>
            <tr>
              <th class="table-num">#</th>
              ${columns.map((label) => `<th>${label}</th>`).join("")}
            </tr>
          </thead>
          <tbody>${skeletonRowsHtml(columns.length + 1)}</tbody>
        </table>
      </div>`;
    withTableLoading(host, skeleton, renderRows);
  }

  // ---------- Mapped Hotels ----------

  // One combined list, no Directly Added / Additionally Mapped split — a
  // hotel could technically land in both (its own home city already is this
  // city, but it was also separately mapped), so dedupe by id rather than
  // risk listing it twice.
  // Each hotel is returned with the relation it has to THIS city, since
  // that is what the list is being read for: primary if this is the
  // hotel's own city, secondary if it was attached on top of one. The two
  // sets are walked direct-first so a hotel that somehow appears in both
  // (redundant data — its own city is also listed among its mapped ones)
  // is kept once, as primary: that's the stronger claim of the two.
  function cityHotels(cityId) {
    const { direct, mapped } = getCityHotelSummary(cityId);
    const seen = new Set();
    return [
      ...direct.map((hotel) => ({ hotel, primary: true })),
      ...mapped.map((hotel) => ({ hotel, primary: false })),
    ].filter(({ hotel }) => {
      if (seen.has(hotel.id)) return false;
      seen.add(hotel.id);
      return true;
    });
  }

  // ---------- The tab row ----------
  // Hotels and every supplier are tabs in one row over one panel: they are
  // the same question ("what is mapped to this city") asked of different
  // sources, so stacking them as separate sections made the popup taller
  // than it needed to be and pushed the suppliers below the fold. Hotels is
  // pinned outside the scrolling strip — it is not one of the suppliers,
  // and it must stay reachable however far the strip is scrolled.

  const summaryHotelsTab = document.querySelector('[data-summary-tab="hotels"]');
  const summarySupplierTabs = document.getElementById("summarySupplierTabs");
  const summaryPanelBody = document.getElementById("summaryPanelBody");
  const summaryPaginationBar = document.getElementById("summaryPaginationBar");
  const summarySupplierEmpty = document.getElementById("summarySupplierEmpty");
  const summaryTabsSearch = document.getElementById("summaryTabsSearch");
  const summaryTabsPrev = document.getElementById("summaryTabsPrev");
  const summaryTabsNext = document.getElementById("summaryTabsNext");

  // Which city's Summary is open. Nothing else is held: the strip is the
  // supplier list itself, which the app already knows, and a tab's rows are
  // fetched when that tab is opened.
  let summaryCityId = null;

  // The strip is built once, from the supplier list — not from anything
  // read per city. Every supplier here is an independent source with its
  // own storage, so "which of them has rows for this city" cannot be
  // answered without asking each one in turn; the strip therefore carries
  // no counts and marks nothing as empty, and each tab is a question the
  // user asks rather than one answered up front. See the dev notes.
  // Inserted before the strip's static "no match" line rather than over it
  // — that line lives inside the strip so it can take the tabs' own place
  // when the filter empties them.
  summarySupplierTabs.insertAdjacentHTML(
    "afterbegin",
    Object.keys(SUPPLIER_LABELS)
      .map(
        (key) =>
          `<button type="button" class="supplier-tab" role="tab" aria-selected="false" data-summary-supplier="${key}" title="${SUPPLIER_LABELS[key]}"><span class="supplier-tab-label">${SUPPLIER_LABELS[key]}</span></button>`
      )
      .join("")
  );

  // `tabKey` is "hotels" or a supplier key — one panel serves both, so
  // switching between a city's hotels and one of its suppliers is the same
  // gesture and only ever leaves one list on screen.
  function showSummaryTab(tabKey) {
    const isHotels = tabKey === "hotels";
    const supplierLabel = isHotels ? null : SUPPLIER_LABELS[tabKey];
    if (!isHotels && !supplierLabel) return;

    summaryHotelsTab.classList.toggle("active", isHotels);
    summaryHotelsTab.setAttribute("aria-selected", String(isHotels));
    summarySupplierTabs.querySelectorAll(".supplier-tab").forEach((tab) => {
      const active = tab.dataset.summarySupplier === tabKey;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      // Selecting a supplier scrolled out of view has to bring its tab back
      // into view, or the strip would show nothing selected.
      if (active) tab.scrollIntoView({ block: "nearest", inline: "nearest" });
    });
    // The active tab is never filtered out, so re-running the filter after a
    // selection is what un-hides it if the current query doesn't match it.
    applySummaryTabFilter();

    // Back to page 1: a page number carried over from the previous tab
    // would point into a list that no longer exists.
    summaryTableState = { page: 1, pageSize: summaryTableState.pageSize };

    // The footer belongs to the table being loaded, so it goes blank until
    // that table is on screen — leaving the previous tab's page numbers
    // under a spinner would be describing a list that isn't there.
    summaryPaginationBar.innerHTML = "";

    // The tab's own lookup, run now rather than on open: one supplier, or
    // the hotels. Whether it comes back empty is only knowable by asking.
    const rows = isHotels ? cityHotels(summaryCityId) : supplierCitiesForCity(tabKey, summaryCityId);
    const columns = isHotels ? SUMMARY_HOTEL_COLUMNS : SUMMARY_CITY_COLUMNS;

    withSummaryLoading(summaryPanelBody, columns, () => {
      if (!rows.length) {
        summaryPanelBody.innerHTML = isHotels
          ? `<div class="empty-state">No hotels are mapped to this city</div>`
          : `<div class="empty-state">No ${supplierLabel} cities mapped to this city</div>`;
        return;
      }
      renderSummaryTable(summaryPanelBody, rows, columns, isHotels ? summaryHotelRowHtml : summaryCityRowHtml(tabKey));
    });
  }

  document.querySelector("#summaryModal .summary-tabs-bar").addEventListener("click", (e) => {
    const tab = e.target.closest("[data-summary-tab], [data-summary-supplier]");
    if (!tab || tab.classList.contains("active")) return;
    showSummaryTab(tab.dataset.summaryTab || tab.dataset.summarySupplier);
  });

  // Narrows the tabs by name, never hides the supplier currently being
  // shown, and still says "no match" when the query genuinely matches
  // nothing — same behaviour as city-mapping.html's own strip.
  function applySummaryTabFilter() {
    const query = summaryTabsSearch.value.trim().toLowerCase();
    let matches = 0;
    summarySupplierTabs.querySelectorAll(".supplier-tab").forEach((tab) => {
      const match = !query || tab.textContent.toLowerCase().includes(query);
      if (match) matches++;
      tab.hidden = !match && !tab.classList.contains("active");
    });
    summarySupplierEmpty.hidden = matches > 0;
    syncSummaryTabsOverflow();
  }

  // The arrows only earn their space once the tabs actually overflow, which
  // depends on how many suppliers exist and how wide the popup is — so it's
  // measured, not assumed, and re-measured on scroll, on resize and on
  // every open.
  function syncSummaryTabsOverflow() {
    const overflowing = summarySupplierTabs.scrollWidth > summarySupplierTabs.clientWidth + 1;
    summaryTabsPrev.hidden = !overflowing;
    summaryTabsNext.hidden = !overflowing;
    if (!overflowing) return;

    // Whether an arrow still has somewhere to go is decided by where the
    // first/last tab actually sits, not by scrollLeft vs
    // scrollWidth - clientWidth: on a fractional device pixel ratio (a
    // browser at 125% zoom, say) that arithmetic never reaches its own
    // maximum, leaving the Next arrow enabled at the end of the strip.
    const visibleTabs = [...summarySupplierTabs.querySelectorAll(".supplier-tab")].filter((tab) => !tab.hidden);
    const stripBox = summarySupplierTabs.getBoundingClientRect();
    const firstBox = visibleTabs[0] && visibleTabs[0].getBoundingClientRect();
    const lastBox = visibleTabs[visibleTabs.length - 1] && visibleTabs[visibleTabs.length - 1].getBoundingClientRect();
    summaryTabsPrev.disabled = !firstBox || firstBox.left >= stripBox.left - 2;
    summaryTabsNext.disabled = !lastBox || lastBox.right <= stripBox.right + 2;
  }

  // Scrolls by most of a "page" rather than a fixed tab count, so the jump
  // matches what's actually visible at this width.
  function scrollSummaryTabs(direction) {
    summarySupplierTabs.scrollBy({ left: direction * Math.max(summarySupplierTabs.clientWidth - 80, 120), behavior: "smooth" });
  }

  // The table's own sticky <thead> has to stop below the sticky tab row
  // rather than under it, so the row's real height is published as a custom
  // property for the CSS to offset against. Measured, not hardcoded — the
  // row is as tall as whichever of the tabs and the search box is taller.
  function syncSummaryTabsHeight() {
    const bar = document.querySelector("#summaryModal .summary-tabs-bar");
    const body = document.querySelector("#summaryModal .modal-body");
    if (bar && body) body.style.setProperty("--summary-tabs-h", `${Math.round(bar.getBoundingClientRect().height)}px`);
  }

  summaryTabsPrev.addEventListener("click", () => scrollSummaryTabs(-1));
  summaryTabsNext.addEventListener("click", () => scrollSummaryTabs(1));
  summarySupplierTabs.addEventListener("scroll", syncSummaryTabsOverflow);
  window.addEventListener(
    "resize",
    debounce(() => {
      syncSummaryTabsOverflow();
      syncSummaryTabsHeight();
    }, 150)
  );

  summaryTabsSearch.addEventListener("input", () => {
    summarySupplierTabs.scrollLeft = 0;
    applySummaryTabFilter();
  });

  // ---------- Opening it ----------

  function openSummary(record) {
    // Any in-flight list belongs to the city last opened — invalidate it, or
    // its rows would land in this city's panel.
    cancelTableLoading(summaryPanelBody);
    summaryCityId = record.id;

    document.getElementById("summaryCityName").textContent = `— ${record.name} (ID: ${getSystemCityDisplayId(record.id)})`;
    // A fresh search each time: a filter left over from the last city would
    // silently hide suppliers in this one.
    summaryTabsSearch.value = "";

    // Nothing is selected on open and nothing is read from the data: no
    // tab carries a count, so opening this popup asks the sources nothing
    // at all. The first lookup happens when the user picks the tab they
    // came here for — which they already know, since they arrived with a
    // supplier (or the hotels) in mind. Same "no tab selected until you
    // pick one" model as city-mapping.html's own strip.
    summaryHotelsTab.classList.remove("active");
    summaryHotelsTab.setAttribute("aria-selected", "false");
    summarySupplierTabs.querySelectorAll(".supplier-tab").forEach((tab) => {
      tab.classList.remove("active");
      tab.setAttribute("aria-selected", "false");
      tab.hidden = false;
    });
    summarySupplierTabs.scrollLeft = 0;
    summarySupplierEmpty.hidden = true;
    summaryPaginationBar.innerHTML = "";
    summaryPanelBody.innerHTML = `<div class="empty-state">Select Hotels or a supplier above to see what is mapped to this city</div>`;

    openModal(document.getElementById("summaryModal"));
    // Each open starts at the top of the panel, however far the previous
    // city's list had been scrolled.
    document.querySelector("#summaryModal .modal-body").scrollTop = 0;
    // Re-measured once the popup is actually laid out at its own width —
    // measuring the strip while the box is still collapsed would decide
    // "no overflow" for a width it never had, and the tab row would report
    // a height the sticky table header can't offset against.
    requestAnimationFrame(() => {
      syncSummaryTabsOverflow();
      syncSummaryTabsHeight();
    });
  }

  document.addEventListener("click", (e) => {
    const editBtn = e.target.closest("[data-edit-btn]");
    if (editBtn) {
      const record = SYSTEM_CITIES.find((c) => String(c.id) === editBtn.dataset.rowId);
      if (!record) return;
      openCityForm(record);
      return;
    }

    const historyBtn = e.target.closest("[data-history-btn]");
    if (historyBtn) {
      const record = SYSTEM_CITIES.find((c) => String(c.id) === historyBtn.dataset.rowId);
      if (!record) return;
      document.getElementById("historyCityName").textContent = `— ${record.name} (ID: ${getSystemCityDisplayId(record.id)})`;
      showHistoryList(record.history, "No edit history yet");
      openModal(document.getElementById("historyModal"));
      return;
    }

    const summaryBtn = e.target.closest("[data-summary-btn]");
    if (summaryBtn) {
      const record = SYSTEM_CITIES.find((c) => String(c.id) === summaryBtn.dataset.rowId);
      if (!record) return;
      openSummary(record);
      return;
    }

    const toggleBtn = e.target.closest("[data-toggle-active-btn]");
    if (toggleBtn) {
      const record = SYSTEM_CITIES.find((c) => String(c.id) === toggleBtn.dataset.rowId);
      if (!record) return;
      const wasActive = record.active;
      record.active = !record.active;
      record.history.push({
        operation: "Status Change",
        status: record.active,
        description: `Status: ${wasActive ? "Active" : "Inactive"} -> ${record.active ? "Active" : "Inactive"}`,
        userName: CURRENT_USER.name,
        userEmail: CURRENT_USER.email,
        timestamp: new Date(),
      });
      saveToStorage("SYSTEM_CITIES", SYSTEM_CITIES);
      render();
      showToast(`${record.name} marked ${record.active ? "Active" : "Inactive"}`);
    }
  });

  // ---------- Add / Edit City drawer ----------
  // One drawer serves both, same dual-mode pattern as hotel-system.html's
  // openHotelForm(): pass a record to edit it, pass nothing to add. A city's
  // country is permanent once created, so Country is a live select in add
  // mode and disabled in edit mode. State follows the same rule with one
  // exception — see wasAddedInApp() below.

  const cityFormModal = document.getElementById("cityFormModal");
  const cityFormTitle = document.getElementById("cityFormTitle");
  const cityFormIdGroup = document.getElementById("cityFormIdGroup");
  const cityFormId = document.getElementById("cityFormId");
  const cityFormCountry = document.getElementById("cityFormCountry");
  const cityFormState = document.getElementById("cityFormState");
  const cityFormName = document.getElementById("cityFormName");
  const saveCityBtn = document.getElementById("saveCityBtn");

  cityFormCountry.insertAdjacentHTML(
    "beforeend",
    SYSTEM_COUNTRIES.map((c) => `<option value="${c.name}">${c.name} (${c.code})</option>`).join("")
  );

  // Same cascade the other forms in this project use — State only becomes
  // selectable for countries that actually have states, and is never
  // required.
  function populateCityFormStates(countryName, selectedState) {
    const meta = SYSTEM_COUNTRIES.find((c) => c.name === countryName);
    const states = meta ? getStatesForCountryCode(meta.code) : [];
    if (states.length) {
      cityFormState.disabled = false;
      cityFormState.innerHTML =
        `<option value="">Select state</option>` + states.map((s) => `<option value="${s}">${s}</option>`).join("");
      if (selectedState) cityFormState.value = selectedState;
    } else {
      cityFormState.disabled = true;
      cityFormState.innerHTML = `<option value="">${meta ? "No state required" : "Select country first"}</option>`;
    }
  }

  cityFormCountry.addEventListener("change", () => populateCityFormStates(cityFormCountry.value));

  // Was this city created through the Add City drawer, rather than shipped in
  // the seed data? Read off the history instead of a stored flag: a city
  // created here always logs a Create entry as its first history row, and
  // nothing else ever writes one. That keeps this from becoming a new stored
  // city status (the New/Merged/Custom system was deliberately removed) and
  // means cities added before this rule existed are covered too, since their
  // Create entry is already sitting in their saved history.
  function wasAddedInApp(record) {
    return Boolean(record) && record.history.some((h) => h.operation === "Create");
  }

  function openCityForm(record) {
    const isEdit = Boolean(record);
    cityFormTitle.textContent = isEdit ? "Edit City" : "Add City";
    saveCityBtn.textContent = isEdit ? "Save Changes" : "Save City";
    cityFormModal.dataset.activeRow = isEdit ? record.id : "";
    cityFormIdGroup.style.display = isEdit ? "" : "none";

    if (isEdit) {
      cityFormId.value = getSystemCityDisplayId(record.id);
      cityFormCountry.value = getSystemCountryName(record.country.code) || record.country.name;
      populateCityFormStates(cityFormCountry.value, record.state);
      // A city can legitimately have no state even in a country that has
      // them — keep the select showing nothing selected rather than
      // silently falling back to the first state in the list.
      if (!record.state) cityFormState.value = "";
      cityFormName.value = record.name;
    } else {
      cityFormCountry.value = "";
      populateCityFormStates("");
      cityFormName.value = "";
    }
    // Country is only ever editable while adding, so the country a city was
    // filed under can't drift. State stays editable for a city added through
    // this drawer — its state was picked from this same State select when the
    // record was created, so a wrong pick stays correctable — but is locked
    // for a seeded city. Either way populateCityFormStates() has the final
    // say when the country has no states at all.
    cityFormCountry.disabled = isEdit;
    cityFormState.disabled = (isEdit && !wasAddedInApp(record)) || cityFormState.disabled;

    openModal(cityFormModal);
    cityFormName.focus();
  }

  document.getElementById("addCityBtn").addEventListener("click", () => openCityForm());

  saveCityBtn.addEventListener("click", () => {
    const rowId = cityFormModal.dataset.activeRow;
    const isEdit = rowId !== "";
    const name = cityFormName.value.trim();

    if (!isEdit && !cityFormCountry.value) {
      showToast("Please select a country", "error");
      return;
    }
    // A city's state is part of the record, not a narrowing filter, so unlike
    // every other State control in this project it is required — but only for
    // a country the system actually holds states for (US/CA today). For any
    // other country the select is disabled and there is nothing to require.
    // Checked on edit too, so an editable state can't be cleared back to none.
    if (!cityFormState.disabled && !cityFormState.value) {
      showToast("Please select a state", "error");
      return;
    }
    if (!name) {
      showToast("City name is required", "error");
      return;
    }

    if (isEdit) {
      const record = SYSTEM_CITIES.find((c) => String(c.id) === String(rowId));
      if (record) {
        // Collect every actual change first so one save writes one history
        // entry, however many fields moved — matching how a single Edit row
        // has always represented a single trip through this drawer.
        const changes = [];
        if (record.name !== name) {
          changes.push(`Name: ${record.name} -> ${name}`);
          record.name = name;
        }
        if (wasAddedInApp(record) && !cityFormState.disabled) {
          const newState = cityFormState.value || null;
          if ((record.state || null) !== newState) {
            changes.push(`State: ${record.state || "None"} -> ${newState || "None"}`);
            record.state = newState;
          }
        }
        if (changes.length) {
          record.history.push({
            operation: "Edit",
            name: record.name,
            description: changes.join(", "),
            userName: CURRENT_USER.name,
            userEmail: CURRENT_USER.email,
            timestamp: new Date(),
          });
        }
      }
      saveToStorage("SYSTEM_CITIES", SYSTEM_CITIES);
      render();
      cityFormModal.classList.remove("open");
      showToast("City updated successfully");
      return;
    }

    const meta = SYSTEM_COUNTRIES.find((c) => c.name === cityFormCountry.value);
    const stateValue = cityFormState.disabled ? null : cityFormState.value || null;
    const newId = SYSTEM_CITIES.length;
    SYSTEM_CITIES.push({
      id: newId,
      name,
      state: stateValue,
      country: { name: meta.name, code: meta.code },
      active: true,
      history: [
        {
          operation: "Create",
          name,
          description: [`Name: ${name}`, stateValue ? `State: ${stateValue}` : null, `Country: ${meta.name} (${meta.code})`]
            .filter(Boolean)
            .join(", "),
          userName: CURRENT_USER.name,
          userEmail: CURRENT_USER.email,
          timestamp: new Date(),
        },
      ],
    });
    saveToStorage("SYSTEM_CITIES", SYSTEM_CITIES);
    cityFormModal.classList.remove("open");

    // Surface what was just created instead of dropping the user back on
    // whatever page of the list they were on — a new city always lands at
    // the end of the list, so without this it'd be invisible behind the
    // current filters. The Country filter is set alongside the name search:
    // against a real backend those two together are what narrows the query,
    // where a bare name search would have to scan every country. State is
    // rebuilt for that country but left on All, and Status is cleared, so
    // the row is shown because it matches and not by coincidence.
    citySearch.value = name;
    countryFilterSelect.value = meta.name;
    const newCityStates = getStatesForCountryCode(meta.code);
    if (newCityStates.length) {
      stateFilterSelect.disabled = false;
      stateFilterSelect.innerHTML =
        `<option value="">All States</option>` + newCityStates.map((s) => `<option value="${s}">${s}</option>`).join("");
    } else {
      stateFilterSelect.disabled = true;
      stateFilterSelect.innerHTML = `<option value="">Select State</option>`;
    }
    statusFilterSelect.value = "all";
    // Cleared rather than switched to "Custom Only": the point is to show
    // the row that was just created, and leaving "Original Only" set would
    // hide the very city this is trying to surface.
    customFilterToggle.checked = false;
    state = { ...state, page: 1, query: name, country: meta.name, cityState: "", status: "all", customOnly: false };
    render();
    showToast("City added successfully");
  });

  // Pre-select country filter when arriving from a deep link, e.g.
  // city-system.html?country=GB (used by the "View Cities" action on the
  // System Country List page). The link passes the standard ISO country
  // code, but #cityCountryFilter's <option> values are keyed by country
  // name (not code), so resolve code -> name before applying it.
  const urlParams = new URLSearchParams(location.search);
  const linkedCountryCode = urlParams.get("country");
  const linkedCountryMeta = linkedCountryCode ? SYSTEM_COUNTRIES.find((c) => c.code === linkedCountryCode) : null;
  const linkedCountryName = linkedCountryMeta ? linkedCountryMeta.name : null;
  if (linkedCountryName && countryFilterSelect.querySelector(`option[value="${linkedCountryName}"]`)) {
    countryFilterSelect.value = linkedCountryName;
    countryFilterSelect.dispatchEvent(new Event("change"));
  }

  // city-system.html?customOnly=1 lands with the list already narrowed to
  // cities added through Add City — for linking straight to "what have we
  // added ourselves" from anywhere else in the app.
  if (urlParams.get("customOnly") === "1") {
    customFilterToggle.checked = true;
    customFilterToggle.dispatchEvent(new Event("change"));
  }

  render();

  // city-system.html?add=1 opens the Add City drawer straight away — used by
  // the Dashboard's "Add" shortcut on its System Cities tile, now that there
  // is no separate Add City page to link to.
  if (urlParams.get("add") === "1") openCityForm();
</script>
</body>
</html>
